<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7eafa">
<title>A little invitation 💌</title>
<style>
:root{--lav:#d9c4f0;--lav2:#b99bdc;--pink:#f4c8dc;--ink:#59466b;--deep:#76578d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Georgia,"Times New Roman",serif;color:var(--ink);background:radial-gradient(circle at 15% 15%,#fff7fc 0 8%,transparent 28%),radial-gradient(circle at 85% 80%,#eee1fb 0 10%,transparent 32%),linear-gradient(135deg,#f9eaf3,#eee5fb 55%,#fcecf4);display:grid;place-items:center;overflow-x:hidden;padding:24px}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(2px);pointer-events:none;opacity:.5}
body:before{width:260px;height:260px;background:#f7cfe1;top:-100px;right:-90px}
body:after{width:300px;height:300px;background:#d8c5f0;bottom:-150px;left:-100px}
.float{position:fixed;z-index:0;pointer-events:none;animation:floatUp linear infinite;opacity:.7}
@keyframes floatUp{from{transform:translateY(105vh) rotate(0deg);opacity:0}15%{opacity:.75}to{transform:translateY(-15vh) rotate(35deg);opacity:0}}
.card{position:relative;z-index:1;width:min(100%,570px);padding:clamp(25px,6vw,48px);text-align:center;background:rgba(255,255,255,.76);border:1px solid rgba(255,255,255,.9);border-radius:30px;box-shadow:0 22px 65px rgba(116,82,143,.17);backdrop-filter:blur(12px);animation:appear .8s ease both}
@keyframes appear{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.envelope{font-size:38px;display:inline-block;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(5deg)}}
.eyebrow{font:600 11px/1.4 Arial,sans-serif;letter-spacing:3px;text-transform:uppercase;color:#a184b6;margin:12px 0}
h1{font-size:clamp(34px,8vw,54px);font-weight:normal;line-height:1.08;margin:8px 0 12px;color:#76578d}
.sub{font:15px/1.6 Arial,sans-serif;color:#927ca2;margin:0 auto 28px;max-width:330px}
.buttons{position:relative;display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;min-height:54px}
button{position:relative;border:0;border-radius:999px;padding:14px 30px;font:600 15px Arial,sans-serif;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease;box-shadow:0 8px 18px #9875aa26;touch-action:manipulation}
button:hover{box-shadow:0 10px 22px #9875aa35}
button:active{transform:scale(.97)}
.heart-burst{position:absolute;z-index:5;left:50%;top:50%;pointer-events:none;font-size:19px;line-height:1;animation:heartRise 1.15s ease-out forwards;will-change:transform,opacity}
@keyframes heartRise{
  0%{opacity:0;transform:translate(-50%,0) scale(.55) rotate(-8deg)}
  15%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--drift)), -88px) scale(1.2) rotate(var(--turn))}
}
.yes{background:linear-gradient(135deg,#eebbd6,#d7b9ee);color:#63466f}
.no{background:#f1eaf7;color:#7e6b8b;border:1px solid #e4d7ef}
.note{font:12px Arial,sans-serif;color:#b09bbd;margin-top:25px}
.result{display:none;animation:appear .65s ease both}
.result img{display:block;width:100%;max-height:60vh;object-fit:contain;border-radius:16px;box-shadow:0 12px 30px #60466a2b;background:#f8f2fa;margin:20px auto 18px}
.result h2{font-weight:normal;font-size:clamp(25px,6vw,34px);margin:12px 0 8px;color:#76578d}
.result p{font:14px/1.6 Arial,sans-serif;color:#907a9d;margin:0 auto 20px}
.send{background:linear-gradient(135deg,#c9b0e8,#efbfd8);color:#543d67;padding:14px 25px}
.again{display:block;margin:14px auto 0;background:transparent;box-shadow:none;color:#9b86a8;font-size:12px;padding:8px}
.tiny{font:11px Arial,sans-serif;color:#b5a3c0;margin-top:15px}
@media(max-width:600px){
  body{padding:16px}
  .card{width:100%;padding:clamp(22px,6vw,36px);border-radius:24px}
  .buttons{gap:10px}
  button{max-width:100%;padding:13px 22px;font-size:14px}
  .result img{max-height:52vh}
}
@media(max-width:360px){
  .buttons{gap:8px}
  button{padding:12px 17px;font-size:13px}
  .eyebrow{letter-spacing:2px}
}
@media (hover:hover) and (pointer:fine){
  .yes:hover{transform:translateY(-2px) scale(1.03)}
}
@media (hover:none), (pointer:coarse){
  .no{transform:none!important}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="floaties"></div>
<main class="card">
  <section id="question">
    <div class="envelope">💌</div>
    <div class="eyebrow">A tiny question for you</div>
    <h1>Let's go out:</h1>
    <p class="sub">I was thinking… you, me, and a little adventure. What do you say?</p>
    <div class="buttons">
      <button class="yes" id="yesBtn" onclick="choose('yes')">Yes! 💗</button>
      <button class="no" id="noBtn" onclick="choose('no')">No 😈</button>
    </div>
    <div class="note">Choose wisely. The committee is watching. ✨</div>
  </section>

  <section class="result" id="result" aria-live="polite">
    <div class="envelope" id="reaction">💗</div>
    <h2 id="headline"></h2>
    <p id="message"></p>
    <img id="painting" alt="Your answer's very dramatic illustration">
    <button class="send" id="sendBtn" onclick="sendAnswer()">Tell him on WhatsApp 💬</button>
    <button class="again" onclick="resetPage()">← Change my answer</button>
    <div class="tiny">One tap away from making someone's day.</div>
  </section>
</main>

};
const phone = "963992034406";
let selectedAnswer = "";
const messages = {
 yes: "She said YES! 💗🥂",
 no: "She said NO. 💀 Better luck next time!"
};

// Playful hover effects are enabled only for devices with a real mouse/trackpad.
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const desktopHover = window.matchMedia("(hover: hover) and (pointer: fine)");

function releaseHearts(){
 if(!desktopHover.matches || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
 const hearts=["💗","💕","💜"];
 for(let i=0;i<9;i++){
   const heart=document.createElement("span");
   heart.className="heart-burst";
   heart.textContent=hearts[i%hearts.length];
   heart.style.setProperty("--drift",(Math.random()*100-50)+"px");
   heart.style.setProperty("--turn",(Math.random()*50-25)+"deg");
   heart.style.left=(25+Math.random()*50)+"%";
   heart.style.animationDelay=(Math.random()*0.16)+"s";
   yesBtn.appendChild(heart);
   heart.addEventListener("animationend",()=>heart.remove(),{once:true});
 }
}

function dodgeNoButton(){
 if(!desktopHover.matches || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
 // Small movements keep the No button visible and realistically clickable.
 const dx=Math.round(Math.random()*28-14);
 const dy=Math.round(Math.random()*20-10);
 noBtn.style.transform=`translate(${dx}px, ${dy}px)`;
}

noBtn.addEventListener("mouseleave",()=>{
 noBtn.style.transform="";
});
yesBtn.addEventListener("mouseenter",releaseHearts);
noBtn.addEventListener("mouseenter",dodgeNoButton);
desktopHover.addEventListener?.("change",()=>{
 noBtn.style.transform="";
});

function choose(answer){
 selectedAnswer=answer;
 document.getElementById("question").style.display="none";
 const result=document.getElementById("result");
 result.style.display="block";
 document.getElementById("painting").src=paintings[answer];
 if(answer==="yes"){
   document.getElementById("reaction").textContent="🥳";
   document.getElementById("headline").textContent="Excellent choice!";
   document.getElementById("message").textContent="A date is officially on the horizon. ✨";
   document.getElementById("sendBtn").textContent="Send the good news 💗";
 }else{
   document.getElementById("reaction").textContent="💀";
   document.getElementById("headline").textContent="Well… this took a dark turn.";
   document.getElementById("message").textContent="A moment of silence for the plans that never were. 🥀";
   document.getElementById("sendBtn").textContent="Deliver the dramatic news 💬";
 }
}
function sendAnswer(){
 if(!selectedAnswer)return;
 const url="https://wa.me/"+phone+"?text="+encodeURIComponent(messages[selectedAnswer]);
 window.open(url,"_blank","noopener,noreferrer");
}
function resetPage(){
 noBtn.style.transform="";
 selectedAnswer="";
 document.getElementById("result").style.display="none";
 document.getElementById("question").style.display="block";
}
const floaties=document.getElementById("floaties");
const symbols=["♡","✦","♥","✧","⋆"];
for(let i=0;i<22;i++){
 const el=document.createElement("span");
 el.className="float";el.textContent=symbols[i%symbols.length];
 el.style.left=(Math.random()*100)+"vw";
 el.style.animationDuration=(9+Math.random()*12)+"s";
 el.style.animationDelay=(-Math.random()*18)+"s";
 el.style.fontSize=(12+Math.random()*17)+"px";
 el.style.color=i%2?"#c5a9df":"#e8aeca";
 floaties.appendChild(el);
}
</script>
